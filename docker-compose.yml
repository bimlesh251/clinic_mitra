services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/clinic
    depends_on:
      - mongo
  
  mongo:
    image: mongo:7

    ports:
      - "27017:27017"
    
    volumes:
      - mongo_data:/data/db
    
volumes:
  mongo_data:
